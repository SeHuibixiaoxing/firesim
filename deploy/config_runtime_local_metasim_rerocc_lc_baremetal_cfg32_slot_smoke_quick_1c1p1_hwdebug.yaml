# Local metasim runtime config for 1-core/1-pair hardware-debug bring-up.

run_farm:
  base_recipe: run-farm-recipes/externally_provisioned.yaml
  recipe_arg_overrides:
    default_platform: EC2InstanceDeployManager
    default_simulation_dir: /home/ubuntu
    run_farm_hosts_to_use:
      - localhost: one_local_metasim_spec
    run_farm_host_specs:
      - one_local_metasim_spec:
          num_fpgas: 0
          num_metasims: 1
          use_for_switch_only: false

metasimulation:
  metasimulation_enabled: true
  metasimulation_host_simulator: verilator
  metasimulation_only_plusargs: "+fesvr-step-size=128 +max-cycles=100000000"
  metasimulation_only_vcs_plusargs: "+vcs+initreg+0 +vcs+initmem+0"

target_config:
  topology: no_net_config
  no_net_num_nodes: 1
  link_latency: 6405
  switching_latency: 10
  net_bandwidth: 200
  profile_interval: -1
  default_hw_config: firesim_gemmini_rerocc_pairmanager_dummy8x8_1c1p1_sbus64_hwdebug
  plusarg_passthrough: "+heartbeat-polling-interval=10000000 +trace-min-batch=0"

tracing:
  enable: yes
  output_format: 0
  selector: 3
  start: "ffffffff00008013"
  end: "ffffffff00010013"

autocounter:
  read_rate: 10000

workload:
  workload_name: rerocc-lc-baremetal-cfg32-slot-smoke-quick.json
  terminate_on_completion: yes
  suffix_tag: local-metasim-rerocc-baremetal-cfg32-slot-smoke-quick-1c1p1-hwdebug

host_debug:
  zero_out_dram: no
  disable_synth_asserts: no

synth_print:
  start: 0
  end: -1
  cycle_prefix: yes
