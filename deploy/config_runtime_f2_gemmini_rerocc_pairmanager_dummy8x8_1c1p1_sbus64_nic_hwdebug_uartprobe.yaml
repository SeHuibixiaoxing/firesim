# F2 runtime config for 1-core/1-pair Linux hardware-debug UART/DMA probe.

run_farm:
  base_recipe: run-farm-recipes/aws_ec2.yaml
  recipe_arg_overrides:
    default_platform: EC2InstanceDeployManager
    default_instance_type: f2.12xlarge
    default_simulation_dir: /home/ubuntu
    run_farm_tag: firesim-1c1p1-hwdebug
    run_farm_hosts_to_use:
      - auto_counter: 1

target_config:
  topology: no_net_config
  no_net_num_nodes: 1
  link_latency: 6405
  switching_latency: 10
  net_bandwidth: 200
  profile_interval: -1
  default_hw_config: firesim_gemmini_rerocc_pairmanager_dummy8x8_1c1p1_sbus64_nic_hwdebug
  plusarg_passthrough: "+heartbeat-polling-interval=10000000 +trace-min-batch=0"

tracing:
  enable: yes
  output_format: 0
  selector: 1
  start: 0
  end: -1

autocounter:
  read_rate: 100000

workload:
  workload_name: rerocc-lc-linux-coupleddma-dma-export-alias-uartprobe-1c1p1-hwdebug.json
  terminate_on_completion: yes
  suffix_tag: f2-rerocc-linux-uartprobe-1c1p1-hwdebug

host_debug:
  zero_out_dram: no
  disable_synth_asserts: no

synth_print:
  start: 0
  end: -1
  cycle_prefix: yes
