# Bertmini Linux/F2 runtime workload for the 2-core/6-pair dummy8x8 sbus64
# NIC hardware-debug target with host-control diagnostics enabled.

run_farm:
  base_recipe: run-farm-recipes/aws_ec2.yaml
  recipe_arg_overrides:
    run_farm_tag: pairbertb8d6s64hwdbg
    always_expand_run_farm: true
    launch_instances_timeout_minutes: 60
    ami_id: ami-0d7cdfb6b3ce5b5e0
    run_instance_market: ondemand
    spot_interruption_behavior: terminate
    spot_max_price: ondemand
    default_simulation_dir: /home/ubuntu
    run_farm_hosts_to_use:
      - f2.6xlarge: 1
      - f2.12xlarge: 0
      - f2.48xlarge: 0
      - m4.16xlarge: 0
      - z1d.3xlarge: 0
      - z1d.6xlarge: 0
      - z1d.12xlarge: 0

metasimulation:
  metasimulation_enabled: false
  metasimulation_host_simulator: verilator
  metasimulation_only_plusargs: "+fesvr-step-size=128 +max-cycles=100000000"
  metasimulation_only_vcs_plusargs: "+vcs+initreg+0 +vcs+initmem+0"

target_config:
  topology: example_1config
  no_net_num_nodes: 1
  link_latency: 6405
  switching_latency: 10
  net_bandwidth: 200
  profile_interval: -1
  default_hw_config: firesim_gemmini_rerocc_pairmanager_dummy8x8_2c6p6_sbus64_nic_hwdebug_hostdebug
  plusarg_passthrough: "+simplenic-relaxed-required-bytes=1 +simplenic-empty-switch-poll-interval=1024 +simplenic-token-debug=0 +cpu-managed-stream-debug=0 +firesim-driver-debug +firesim-driver-debug-interval=100000 +firesim-host-control-debug +heartbeat-polling-interval=100000000"

tracing:
  enable: no
  output_format: 0
  selector: 1
  start: 0
  end: -1

autocounter:
  read_rate: 0

workload:
  workload_name: rerocc-lc-linux-coupleddma-bertmini-pipeline-runtime-batch8-fileonly-sync-pairdummy-sbus64-dummy8x8-g6.json
  terminate_on_completion: no
  suffix_tag: f2-gemmini-rerocc-pairmanager-dummy8x8-2c6p6-sbus64-nic-hwdebug-hostdebug-linux-bertmini-batch8-fileonly-sync

host_debug:
  zero_out_dram: no
  disable_synth_asserts: no

synth_print:
  start: 0
  end: -1
  cycle_prefix: yes
