# 1bp single-core Rocket NIC no-Trace F2 build using TIMING_HOLDFIX, with the
# source tree adding CL_DMA_PCIS_SLV/AXI4_REG_SLC_PCIS_SLR1 at the PCIS shell
# boundary. This is the conservative follow-on if the ordinary TIMING PCIS-slice
# comparison still trips router hold bailout.

firesim_rocket_singlecore_nic_notrace_timingholdfixpcisreg1bp_30mhz:
    PLATFORM: f2
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: ../../../generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: FireSimRocketNICNoTraceConfig
    PLATFORM_CONFIG: BaseF2Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 30
        build_strategy: TIMING_HOLDFIX
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/f2.yaml
